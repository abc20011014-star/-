
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紀嘉恆｜TOYOTA 豐原所</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Noto Sans TC", sans-serif;
    background:
        radial-gradient(circle at top, #3a0000 0%, #000 60%);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

.hero {
    max-width: 460px;
    margin: 20px auto;
    background: rgba(0,0,0,0.85);
    border: 2px solid #ff2d2d;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(255,0,0,0.5);
}

.top {
    position: relative;
}

.cover {
    width: 100%;
    display: block;
}

.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.05));
}

.profile {
    text-align: center;
    padding: 25px;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    color: #ff2d2d;
    letter-spacing: 4px;
}

.store {
    font-size: 20px;
    color: #ddd;
    margin-top: 6px;
}

.name {
    font-size: 38px;
    font-weight: bold;
    margin-top: 20px;
}

.job {
    color: #ffb3b3;
    font-size: 18px;
    margin-top: 8px;
}

.slogan {
    margin-top: 18px;
    line-height: 1.9;
    color: #f0f0f0;
    font-size: 15px;
}

.buttons {
    padding: 0 22px 30px;
}

.btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    padding: 16px;
    border-radius: 16px;
    margin-top: 16px;
    font-size: 18px;
    font-weight: bold;
    transition: .25s;
}

.btn:hover {
    transform: scale(1.02);
}

.phone {
    background: linear-gradient(90deg,#ff0000,#ff5a5a);
    color: white;
}

.line {
    background: #06c755;
    color: white;
}

.fb {
    background: #1877f2;
    color: white;
}

.ig {
    background: linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045);
    color: white;
}

.threads {
    background: white;
    color: black;
}

.map {
    background: #ffffff;
    color: #111;
}

.footer {
    text-align: center;
    padding: 20px;
    color: #aaa;
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.1);
}

.glow {
    color: #ffcbcb;
    text-shadow: 0 0 10px red;
}

.line-box {
    margin: 16px 22px 24px;
    padding: 22px;
    border-radius: 22px;
    background: rgba(6,199,85,0.13);
    border: 1px solid rgba(6,199,85,0.65);
    text-align: center;
}
.line-box h2 {
    font-size: 24px;
    margin-bottom: 10px;
}
.line-id {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 2px;
    color: #06c755;
    background: white;
    border-radius: 14px;
    padding: 12px;
    margin: 12px 0;
}
.qr-img {
    width: 210px;
    height: 210px;
    border-radius: 18px;
    background: white;
    padding: 10px;
    margin-top: 12px;
}
.copy-tip {
    color: #e6e6e6;
    font-size: 15px;
    line-height: 1.7;
}

</style>
</head>
